<article>
<section class="event-list">
  <h2>Events</h2>
  {%- assign events = site.events | sort: "event_date" -%}
  {% for event in events %}
    <a class="event-card" href="{{ event.url | relative_url }}">
      <span class="event-card-title">{{ event.title | escape }}</span>
      <span class="event-card-meta">
        <time datetime="{{ event.event_date | date_to_xmlschema }}">{% include event_date_text.html event=event %}</time>
        {% if event.location %}&middot; {{ event.location | escape }}{% endif %}
      </span>
    </a>
  {% endfor %}
</section>
</article>
