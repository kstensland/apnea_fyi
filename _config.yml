title: "Emerald City Apnea Challenge"
# Used in <title> on the home page and as the default meta description (see _includes/seo.html).
tagline: "Seattle Freediving Competitions"
description: "Community-run AIDA freediving competitions in Seattle and the PNW: depth in Puget Sound, pool in Snohomish, WA. Find upcoming events, registration and results."
url: "https://emeraldcity.apnea.fyi"
author: "Kristofer Stensland"
email: "emeraldcityapneachallenge@gmail.com"
logo: "/assets/images/ecac_black.png"        # Organization logo in structured data
og_image: "/assets/images/og_image.jpg"     # default social share image, 1200 x 630
permalink: /:title/
lang: "en"
excerpt_separator: "\n\n\n"
date_format: "%B %d, %Y"

# Layout

show_excerpts: false        # show article excerpts on the home page
show_frame: false           # adds a gray frame to the site
show_sidebar: false        # show a sidebar instead of the usual header
minimal: true             # use a dark header

# The header has only the logo, title and MENU button. The menu's items are in
# _data/menu.yml.

# Developer notes, not part of the public site
exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock

external:                  # shows a footer with social links - for available icons see fontawesome.com/icons
  - {title: Mail, icon: envelope, url: "mailto:emeraldcityapneachallenge@gmail.com"}

comments:
#  disqus_shortname: ""    # see https://disqus.com/
#  isso_domain: ""         # see https://posativ.org/isso/

collections:
  events:                  # one Markdown file per upcoming event in _events/
    output: true
    permalink: /events/:name/
  past_events:             # one Markdown file per past event in _past_events/
    output: true
    permalink: /events/past/:name/

plugins:
 - jekyll-feed
 - jekyll-sitemap           # writes /sitemap.xml; leave a page out with `sitemap: false`

social:
  facebook: "https://www.facebook.com/profile.php?id=61584381043663"
  instagram: "https://www.instagram.com/emeraldcityapneachallenge"
  youtube: "https://www.youtube.com/@emeraldcityapneachallenge"
# Original Theme https://github.com/niklasbuschmann/contrast